name: build-release

on:
  workflow_dispatch:        # 手动触发：Actions 页面 → Run workflow
  push:
    tags: [ 'v*' ]          # 推送 v0.7.0 等 tag 时自动发布 Release

permissions:
  contents: write

jobs:
  build:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Build daemon / cli / mcp
        run: |
          go build -ldflags="-s -w" -o build/bin/serial-daemon.exe ./daemon/
          go build -ldflags="-s -w" -o build/bin/serial-cli.exe    ./cmd/serial-cli/
          go build -ldflags="-s -w" -o build/bin/serial-mcp.exe    ./cmd/serial-mcp/

      - name: Build GUI (wails)
        run: wails build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: serial-debugger-windows-x64
          path: build/bin/*.exe
          if-no-files-found: error

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/bin/*.exe
          generate_release_notes: true
