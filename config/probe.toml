# 设备端口探测规则配置
# 每条规则：对端口发送探测帧 → 匹配响应 → 识别设备类型

# 读取响应超时（毫秒）。这是**唯一**控制探测速度的旋钮：
#   每次尝试最多等 max(3×timeout_ms, 300ms) 才收到第一个字节（收到字节后，
#   帧的收尾由库的读超时决定，与这个预算无关），所以沉默端口上每次尝试的
#   成本就是它。默认 200 → 每次 600ms → 每档（规则数=3）1.8s → 全部 7 档约 12.6s，
#   落在 15s 总预算内，默认不会跳过任何一档。想更快就调小（120 → 全部 7 档约 7.6s），
#   设备应答慢就调大。
timeout_ms = 200

# 扫描的波特率，**按可能性排序**：总预算默认 15s，若被截断，顺序决定先试到哪几档。
# 115200 提到最前——它是本工具目标设备最常见的一档，排在最后曾导致
# 「预算用尽、115200 根本没试」。
# 顺序仍可按需调整；被预算截断时结果里会显式列出「哪些波特率没试」。
baud_rates = [115200, 9600, 19200, 38400, 230400, 460800, 921600]

# ── 探测规则 ──

[[rules]]
name = "Modbus RTU 设备"
port_pattern = ".*"
# 读保持寄存器 0x08（从站地址）：01 03 0008 0001 + CRC
probe_hex = "01030008000105C8"
match_type = "modbus_crc"
min_response_len = 5

[[rules]]
name = "MCU 控制板 (HELP 响应)"
port_pattern = ".*"
# HELP\r\n：48454C500D0A（一般用 text，直接写字符串更方便）
probe_hex = "48454C500D0A"
match_type = "substring"
match_value = "READY"   # 响应中预期子串，为 hex 编码
min_response_len = 5

[[rules]]
name = "MCU 控制板 (# 回显)"
port_pattern = ".*"
probe_hex = "2300"       # '#' 后加空字节触发设备响应
match_type = "regex"
match_value = "#[A-Z_]+:"   # 匹配类似 #BOOT: #READY: 的回显
min_response_len = 5
